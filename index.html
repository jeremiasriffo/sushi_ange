<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carta Digital - Sushi Ange</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
    }
    header {
      background: #111;
      color: white;
      padding: 22px 16px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 28px; }
    header p { margin: 6px 0 0; color: #ddd; }
    main {
      max-width: 900px;
      margin: auto;
      padding: 16px;
      padding-bottom: 140px;
    }
    .card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }
    .promo-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .promo-title h2 { margin: 0; font-size: 20px; }
    .price { font-weight: 700; color: #d80000; }
    .included {
      margin: 8px 0 12px;
      padding-left: 18px;
      color: #333;
      line-height: 1.5;
    }
    label {
      display: block;
      font-weight: 700;
      margin-top: 12px;
      margin-bottom: 6px;
    }
    select, input, textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      background: white;
    }
    .small { font-size: 13px; color: #666; margin-top: 5px; }
    .ingredient-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .extra-box {
      margin-top: 12px;
      padding: 12px;
      border: 1px dashed #d80000;
      border-radius: 12px;
      background: #fff7f7;
    }
    .extra-btn {
      width: 100%;
      background: #111;
      color: white;
      margin-top: 12px;
    }
    .add-btn {
      width: 100%;
      background: #d80000;
      color: white;
      margin-top: 14px;
    }
    .cart-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: white;
      box-shadow: 0 -3px 16px rgba(0,0,0,.16);
      padding: 12px 16px;
      z-index: 10;
    }
    .cart-content {
      max-width: 900px;
      margin: auto;
      display: grid;
      gap: 10px;
    }
    .send-btn {
      width: 100%;
      background: #25D366;
      color: white;
    }
    .cart-list {
      max-height: 160px;
      overflow-y: auto;
      font-size: 14px;
      color: #222;
    }
    .cart-item {
      border-bottom: 1px solid #eee;
      padding: 7px 0;
    }
    .cart-item button {
      background: #eee;
      padding: 5px 8px;
      font-size: 12px;
      margin-top: 5px;
    }
    .total {
      font-weight: 700;
      display: flex;
      justify-content: space-between;
    }
    @media (max-width: 650px) {
      .ingredient-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Sushi Ange</h1>
    <p>Carta digital con pedido por WhatsApp</p>
  </header>

  <main>
    <section class="card">
      <h2>Datos del pedido</h2>
      <label>Nombre</label>
      <input id="cliente" placeholder="Ej: Danna" />
    </section>

    <div id="menu"></div>
  </main>

  <div class="cart-bar">
    <div class="cart-content">
      <div class="cart-list" id="cartList">Aún no has agregado productos.</div>
      <div class="total"><span>Total</span><span id="total">$0</span></div>
      <button class="send-btn" onclick="enviarWhatsApp()">Enviar pedido por WhatsApp</button>
    </div>
  </div>

  <script>
    const WHATSAPP = "56979557665"; // Cambiar por tu número. Ejemplo: 56912345678
    const EXTRA_INGREDIENTE = 500;

    const ingredientes = [
      "Queso Philadelphia",
      "Queso Gauda",
      "Pollo",
      "Camarón",
      "Kanikama",
      "Salmón (+$1.300)",
      "Palta",
      "Pimentón",
      "Choclo",
      "Choclito",
      "Champiñón",
      "Cebollín",
      "Palmito",
      "Zanahoria",
      "Ciboulette"
    ];

    const promos = [
      { id: "A", nombre: "Promo A", precio: 10000, incluido: ["2 sushi burgers"], piezas: "2 sushi burgers", rolls: 2 },
      { id: "B", nombre: "Promo B", precio: 9000, incluido: ["10 envueltos en nori", "10 envueltos en sésamo", "10 envueltos en ciboulette"], piezas: "30 piezas", rolls: 3 },
      { id: "C", nombre: "Promo C", precio: 10000, incluido: ["10 envueltos en tempura", "10 envueltos en palta", "10 envueltos en nori"], piezas: "30 piezas", rolls: 3 },
      { id: "D", nombre: "Promo D", precio: 10500, incluido: ["10 envueltos en tempura", "10 envueltos en palta", "10 envueltos en queso"], piezas: "30 piezas", rolls: 3 },
      { id: "E", nombre: "Promo E", precio: 15000, incluido: ["20 envueltos en sésamo", "20 envueltos en ciboulette", "10 envueltos en nori"], piezas: "50 piezas", rolls: 5 },
      { id: "F", nombre: "Promo F", precio: 16500, incluido: ["10 envueltos en tempura", "10 envueltos en queso", "10 envueltos en palta", "10 envueltos en nori", "10 envueltos en ciboulette"], piezas: "50 piezas", rolls: 5 },
      { id: "G", nombre: "Promo G", precio: 17500, incluido: ["20 envueltos en tempura", "20 envueltos en palta", "10 envueltos en queso"], piezas: "50 piezas", rolls: 5 }
    ];

    let carrito = [];

    function formatCLP(valor) {
      return "$" + valor.toLocaleString("es-CL");
    }

    function crearOpciones(valorActual = "", seleccionados = []) {
      const disponibles = ingredientes.filter(ing => ing === valorActual || !seleccionados.includes(ing));
      return `<option value="">Seleccionar</option>` + disponibles.map(ing => `<option value="${ing}" ${ing === valorActual ? "selected" : ""}>${ing}</option>`).join("");
    }

    function renderMenu() {
      const cont = document.getElementById("menu");
      cont.innerHTML = promos.map(promo => `
        <section class="card">
          <div class="promo-title">
            <h2>${promo.nombre}</h2>
            <span class="price">${formatCLP(promo.precio)}</span>
          </div>
          <strong>${promo.piezas}</strong>
          <ul class="included">
            ${promo.incluido.map(i => `<li>${i}</li>`).join("")}
          </ul>

          <div class="ingredient-grid">
            <div>
              <label>Ingrediente 1</label>
              <select id="ing1-${promo.id}" onchange="actualizarIngredientes('${promo.id}')"></select>
            </div>
            <div>
              <label>Ingrediente 2</label>
              <select id="ing2-${promo.id}" onchange="actualizarIngredientes('${promo.id}')"></select>
            </div>
            <div>
              <label>Ingrediente 3</label>
              <select id="ing3-${promo.id}" onchange="actualizarIngredientes('${promo.id}')"></select>
            </div>
          </div>

          <div id="extraBox-${promo.id}" style="display:none" class="extra-box">
            <label>Ingrediente 4</label>
            <select id="ing4-${promo.id}" onchange="actualizarIngredientes('${promo.id}')"></select>
            <div class="small">El cuarto ingrediente suma ${formatCLP(EXTRA_INGREDIENTE)} por roll. En esta promo serían ${formatCLP(EXTRA_INGREDIENTE * promo.rolls)} extra.</div>
          </div>

          <button class="extra-btn" id="extraBtn-${promo.id}" onclick="mostrarIngredienteExtra('${promo.id}')">+ Agregar ingrediente 4</button>

          <label>Observaciones</label>
          <textarea id="obs-${promo.id}" rows="2" placeholder="Ej: sin soya, sin teriyaki, cortar pequeño..."></textarea>

          <button class="add-btn" onclick="agregarPromo('${promo.id}')">Agregar ${promo.nombre}</button>
        </section>
      `).join("");

      promos.forEach(promo => actualizarIngredientes(promo.id));
    }

    function valoresSeleccionados(id) {
      return [1,2,3,4]
        .map(n => document.getElementById(`ing${n}-${id}`))
        .filter(Boolean)
        .map(select => select.value)
        .filter(Boolean);
    }

    function actualizarIngredientes(id) {
      [1,2,3,4].forEach(n => {
        const select = document.getElementById(`ing${n}-${id}`);
        if (!select) return;

        const valorActual = select.value;
        const seleccionadosOtros = [1,2,3,4]
          .filter(x => x !== n)
          .map(x => document.getElementById(`ing${x}-${id}`))
          .filter(Boolean)
          .map(s => s.value)
          .filter(Boolean);

        select.innerHTML = crearOpciones(valorActual, seleccionadosOtros);
      });
    }

    function mostrarIngredienteExtra(id) {
      document.getElementById(`extraBox-${id}`).style.display = "block";
      document.getElementById(`extraBtn-${id}`).style.display = "none";
      actualizarIngredientes(id);
    }

    function agregarPromo(id) {
      const promo = promos.find(p => p.id === id);
      const ing1 = document.getElementById(`ing1-${id}`).value;
      const ing2 = document.getElementById(`ing2-${id}`).value;
      const ing3 = document.getElementById(`ing3-${id}`).value;
      const extraVisible = document.getElementById(`extraBox-${id}`).style.display !== "none";
      const ing4 = extraVisible ? document.getElementById(`ing4-${id}`).value : "";
      const obs = document.getElementById(`obs-${id}`).value.trim();

      if (!ing1 || !ing2 || !ing3) {
        alert("Debes elegir ingrediente 1, ingrediente 2 e ingrediente 3.");
        return;
      }

      if (extraVisible && !ing4) {
        alert("Debes elegir el ingrediente 4 o quitarlo antes de agregar la promo.");
        return;
      }

      const ingredientesElegidos = [ing1, ing2, ing3];
      if (ing4) ingredientesElegidos.push(ing4);

      const extraSalmon = ingredientesElegidos.includes("Salmón (+$1.300)") ? 1300 : 0;
      const extraCuarto = ing4 ? EXTRA_INGREDIENTE * promo.rolls : 0;

      carrito.push({
        ...promo,
        ingredientesElegidos,
        obs,
        extraSalmon,
        extraCuarto,
        precioFinal: promo.precio + extraSalmon + extraCuarto
      });

      renderCarrito();
    }

    function eliminarItem(index) {
      carrito.splice(index, 1);
      renderCarrito();
    }

    function renderCarrito() {
      const cart = document.getElementById("cartList");
      const total = carrito.reduce((acc, item) => acc + item.precioFinal, 0);
      document.getElementById("total").textContent = formatCLP(total);

      if (carrito.length === 0) {
        cart.innerHTML = "Aún no has agregado productos.";
        return;
      }

      cart.innerHTML = carrito.map((item, index) => `
        <div class="cart-item">
          <strong>${item.nombre}</strong> - ${formatCLP(item.precioFinal)}<br>
          Ingredientes: ${item.ingredientesElegidos.join(", ")}<br>
          ${item.extraSalmon ? `Adicional salmón: ${formatCLP(item.extraSalmon)}<br>` : ""}
          ${item.extraCuarto ? `Ingrediente 4 extra: ${formatCLP(item.extraCuarto)}<br>` : ""}
          ${item.obs ? `Obs: ${item.obs}<br>` : ""}
          <button onclick="eliminarItem(${index})">Eliminar</button>
        </div>
      `).join("");
    }

    function enviarWhatsApp() {
      if (carrito.length === 0) {
        alert("Agrega al menos un producto al pedido.");
        return;
      }

      const cliente = document.getElementById("cliente").value || "No indicado";
      const total = carrito.reduce((acc, item) => acc + item.precioFinal, 0);

      let mensaje = `Hola, quiero hacer un pedido:%0A%0A`;
      carrito.forEach((item, i) => {
        mensaje += `*${i + 1}. ${item.nombre}* - ${formatCLP(item.precioFinal)}%0A`;
        mensaje += `${item.piezas}%0A`;
        mensaje += `Envolturas: ${item.incluido.join(", ")}%0A`;
        mensaje += `Ingredientes: ${item.ingredientesElegidos.join(", ")}%0A`;
        if (item.extraSalmon) mensaje += `Adicional salmón: ${formatCLP(item.extraSalmon)}%0A`;
        if (item.extraCuarto) mensaje += `Ingrediente 4 extra: ${formatCLP(item.extraCuarto)}%0A`;
        if (item.obs) mensaje += `Obs: ${item.obs}%0A`;
        mensaje += `%0A`;
      });

      mensaje += `*Total: ${formatCLP(total)}*%0A%0A`;
      mensaje += `Nombre: ${cliente}`;

      window.open(`https://wa.me/${WHATSAPP}?text=${mensaje}`, "_blank");
    }

    renderMenu();
  </script>
</body>
</html>
